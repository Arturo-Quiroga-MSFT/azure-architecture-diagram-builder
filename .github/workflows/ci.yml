name: CI

# Build verification for the app (and MCP server) on every push and PR.
# Catches "forgot to commit a file" and type errors before they reach a
# collaborator's clone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Vite app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Lockfiles must keep registry.npmjs.org paths: the container build
      # replays them through the Microsoft package proxy, which cannot serve
      # internal feed (ms-feed-*) paths recorded by a local install.
      - name: Check lockfiles use public registry paths
        run: npm run check:lockfiles

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  build-mcp:
    name: Build (MCP server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Test service catalog
        working-directory: mcp-server
        run: npm run test:catalog

      - name: Test tool contracts
        working-directory: mcp-server
        run: npm run test:contracts

      - name: Test diagram rendering
        working-directory: mcp-server
        run: |
          npm run test:render-profiles
          npm run test:render-zero-trust
