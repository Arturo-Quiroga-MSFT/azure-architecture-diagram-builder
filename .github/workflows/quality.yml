name: Release quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The release gate starts server/token-server.js (test:correlation),
      # which has its own package.json and dependencies.
      - name: Install token-server dependencies
        run: npm ci --prefix server

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify release
        run: npm run verify:release