# Included in each location: nginx drops server-level add_header directives in any location that sets its own.
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Range, Request-Id, Request-Context, traceparent, tracestate" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
add_header Access-Control-Max-Age "86400" always;
add_header X-Content-Type-Options "nosniff" always;
