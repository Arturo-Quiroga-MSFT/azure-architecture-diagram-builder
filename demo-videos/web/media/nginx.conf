# Public, read-only media for the AADB video tour. The app's player loads the video and caption tracks with
# crossorigin="anonymous", so every response carries CORS headers (cors.conf). Preflights also allow the tracing
# headers (Request-Id, traceparent) that telemetry SDKs add to fetch(). nginx serves byte ranges natively.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;

    types {
        video/mp4 mp4;
        text/vtt vtt;
        image/jpeg jpg;
        application/json json;
    }
    default_type application/octet-stream;
    gzip on;
    gzip_types text/vtt application/json;

    location = /healthz { return 200 "ok\n"; }

    location = /videos/videos.json {
        include /etc/nginx/cors.conf;
        add_header Cache-Control "public, max-age=300" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    location /videos/ {
        include /etc/nginx/cors.conf;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        try_files $uri =404;
    }

    location / { return 404; }
}
