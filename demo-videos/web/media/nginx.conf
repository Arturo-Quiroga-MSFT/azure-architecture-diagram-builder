# Public, read-only media for the AADB video tour. The app's player loads the video and caption tracks with
# crossorigin="anonymous", so every response carries CORS headers. nginx serves byte ranges natively.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;

    types {
        video/mp4 mp4;
        text/vtt vtt;
        image/jpeg jpg;
        application/json json;
    }
    default_type application/octet-stream;
    gzip on;
    gzip_types text/vtt application/json;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz { return 200 "ok\n"; }

    location = /videos/videos.json {
        if ($request_method = OPTIONS) { return 204; }
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /videos/ {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        try_files $uri =404;
    }

    location / { return 404; }
}
