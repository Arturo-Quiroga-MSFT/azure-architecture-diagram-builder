# Security headers, included at server level AND in every location that sets
# its own add_header: nginx drops server-level add_header directives in any
# location that declares one, so without the include those locations (including
# the SPA's index.html) are served with no security headers at all.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
# Allow the MSAL sign-in popup to message the opener window (delegated
# "Import from Azure" auth). Without this the Microsoft login redirect can
# sever the popup/opener link and MSAL's popup handshake times out.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Shared design links (/d/<id>) are capability URLs: keep them out of search
# engines and out of Referer headers sent to other sites. Values come from maps
# on $request_uri, which survives the SPA's internal redirect to /index.html.
add_header Referrer-Policy $aadb_referrer_policy always;
add_header X-Robots-Tag $aadb_robots_tag always;
